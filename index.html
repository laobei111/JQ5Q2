  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      rgba(10, 14, 29, 0.72) 0%,
      rgba(10, 14, 29, 0.64) 55%,

  /* 密码页 */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #gate.away { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-label {
    font-size: 15px;
    letter-spacing: 0.2em;
    color: rgba(230, 227, 218, 0.75);
    margin-bottom: 36px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .lock-row { display: flex; gap: 16px; }
  .lock-cell {
    width: 46px; height: 56px;
    border: none;
    border-bottom: 1px solid rgba(230, 227, 218, 0.5);
    background: transparent;
    color: #e6e3da;
    font-size: 26px;
    text-align: center;
    outline: none;
    caret-color: #e6e3da;
  }
  .lock-cell:focus { border-bottom-color: #e6e3da; }
  .shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(7px); }
    75% { transform: translateX(-4px); }
  }

  /* 正文 */
  #letter {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 24px 80px;
    opacity: 0;
    visibility: hidden;
  }
  #letter.open { opacity: 1; visibility: visible; transition: opacity 0.8s ease; }
  #letter p {
    font-size: 17px;
    line-height: 1.9;
    letter-spacing: 0.02em;
    margin-bottom: 1.6em;
    color: #e6e3da;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75), 0 0 3px rgba(0, 0, 0, 0.6);
  }
  .sign {
    text-align: right;
    margin-top: 2.5em;
    font-size: 17px;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
  }
  .photo { margin-top: 2.5em; }
  .photo img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
  }
</style>
</head>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

const cells = Array.from(document.querySelectorAll('.lock-cell'));
const gate = document.getElementById('gate');
const letter = document.getElementById('letter');

cells[0].focus();

cells.forEach((cell, i) => {
  cell.addEventListener('input', () => {
    cell.value = cell.value.replace(/\D/g, '').slice(-1);
    if (cell.value && i < 3) cells[i + 1].focus();
    const code = cells.map(c => c.value).join('');
    if (code.length === 4) setTimeout(() => tryUnlock(code), 150);
  });
  cell.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !cell.value && i > 0) cells[i - 1].focus();
  });
});

async function tryUnlock(code) {
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: 150000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(IV_B64) },
      key,
      b64ToBytes(CT_B64)
    );
    /* 解密成功 = 密码正确 */
    letter.innerHTML = new TextDecoder().decode(plain);
    openLetter();
  } catch (e) {
    /* 解密失败 = 密码错误 */
    const row = document.getElementById('lockRow');
    row.classList.add('shake');
    setTimeout(() => {
      row.classList.remove('shake');
      cells.forEach(c => c.value = '');
      cells[0].focus();
    }, 500);
  }
}

function openLetter() {
  gate.classList.add('away');
  letter.classList.add('open');
  window.scrollTo(0, 0);
}
</script>
